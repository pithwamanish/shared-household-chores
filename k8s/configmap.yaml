apiVersion: v1
kind: ConfigMap
metadata:
  name: choresync-config
  labels:
    app.kubernetes.io/name: choresync
    app.kubernetes.io/part-of: choresync
data:
  PORT: "8000"
  EMAIL_PROVIDER: "mock"
  DEPLOYMENT_ENVIRONMENT: "kubernetes"
  SERVICE_VERSION: "k8s-local"
  OTEL_SERVICE_NAME: "api-backend"
  BACKEND_URL: "backend:8000"
  AWS_REGION: "us-east-1"
  AWS_ACCESS_KEY_ID: "test"
  AWS_SECRET_ACCESS_KEY: "test"
  AWS_ENDPOINT_URL: "http://floci:4566"
  S3_BUCKET_NAME: "choresync-proofs"
  SQS_QUEUE_NAME: "choresync-reminders"
  ENABLE_CLOUD_SERVICES: "true"
