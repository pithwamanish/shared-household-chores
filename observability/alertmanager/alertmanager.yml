global:
  resolve_timeout: 30s

route:
  receiver: "on-call-webhook"
  group_by: ["alertname", "service", "environment"]
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 1h

receivers:
  - name: "on-call-webhook"
    webhook_configs:
      - url: "http://on-call-receiver:5050/webhook"
        send_resolved: true
