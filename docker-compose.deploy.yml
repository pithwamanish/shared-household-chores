name: choresync-deploy

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-choresync}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-choresync_secret}
      - POSTGRES_DB=${POSTGRES_DB:-choresync}
    volumes:
      - postgres_deploy_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-choresync} -d ${POSTGRES_DB:-choresync}"]
      interval: 2s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.95.0
    container_name: choresync-deploy-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "${OTEL_GRPC_PORT:-4319}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
    restart: unless-stopped

  floci:
    image: floci/floci:latest
    container_name: choresync-deploy-floci
    ports:
      - "${DEPLOY_FLOCI_PORT:-4568}:4566"
    environment:
      - SERVICES=s3,sqs
      - DEFAULT_REGION=us-east-1
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/4566"]
      interval: 3s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/choresync/backend:latest}
    pull_policy: ${PULL_POLICY:-if_not_present}
    environment:
      - PORT=8000
      - DATABASE_URL=${DATABASE_URL:-postgres://choresync:choresync_secret@postgres:5432/choresync?sslmode=disable}
      - JWT_SECRET=${JWT_SECRET:-choresync_super_secret_jwt_key_2026}
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-mock}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - OTEL_SERVICE_NAME=api-backend
      - DEPLOYMENT_ENVIRONMENT=${DEPLOYMENT_ENVIRONMENT:-production}
      - SERVICE_VERSION=${SERVICE_VERSION:-prod-latest}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-test}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-test}
      - AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL:-http://floci:4566}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-choresync-proofs}
      - SQS_QUEUE_NAME=${SQS_QUEUE_NAME:-choresync-reminders}
      - ENABLE_CLOUD_SERVICES=${ENABLE_CLOUD_SERVICES:-true}
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
      floci:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/choresync/frontend:latest}
    pull_policy: ${PULL_POLICY:-if_not_present}
    ports:
      - "${PORT:-8088}:80"
    environment:
      - PORT=80
      - BACKEND_URL=backend:8000
      - OTEL_SERVICE_NAME=caddy-proxy
      - DEPLOYMENT_ENVIRONMENT=${DEPLOYMENT_ENVIRONMENT:-production}
      - SERVICE_VERSION=${SERVICE_VERSION:-prod-latest}
    depends_on:
      - backend
      - otel-collector
    restart: unless-stopped

volumes:
  postgres_deploy_data:
