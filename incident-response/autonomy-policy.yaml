# ChoreSync On-Call Autonomy Policy (autonomy-policy.yaml)
# Code outside the model enforcing permission boundaries for autonomous responder actions.

policy_version: "1.0.0"
project: "choresync"

autonomy_levels:
  LEVEL_1_AUTO_EXECUTE: "Safe, reversible operational actions executed without human gatekeeping"
  LEVEL_2_HUMAN_APPROVAL: "Code modifications or scaling operations requiring explicit human approval"
  LEVEL_3_ESCALATE: "Unallowlisted, high-risk, or destructive actions blocked immediately"

allowlisted_actions:
  - action_name: "rollback"
    autonomy_level: "LEVEL_1_AUTO_EXECUTE"
    allowed_commands:
      - "bash incident-response/runbooks/rollback.sh"
      - "kubectl rollout undo deployment/backend --context kind-choresync-cluster"
      - "docker compose -f docker-compose.deploy.yml up -d"
      - "make deploy-dev"
    reversible: true
    max_executions_per_incident: 1

  - action_name: "restart_service"
    autonomy_level: "LEVEL_1_AUTO_EXECUTE"
    allowed_commands:
      - "docker compose restart backend"
      - "docker compose restart frontend"
      - "docker compose restart floci"
      - "kubectl rollout restart deployment/backend --context kind-choresync-cluster"
      - "kubectl rollout restart deployment/frontend --context kind-choresync-cluster"
    reversible: true
    max_executions_per_incident: 2

  - action_name: "apply_patch"
    autonomy_level: "LEVEL_2_HUMAN_APPROVAL"
    allowed_commands:
      - "git apply /tmp/patch.diff"
      - "git cherry-pick {commit_sha}"
    requires_human_confirmation: true

  - action_name: "scale_deployment"
    autonomy_level: "LEVEL_2_HUMAN_APPROVAL"
    allowed_commands:
      - "kubectl scale deployment/backend --replicas={replicas} --context kind-choresync-cluster"
      - "kubectl scale deployment/frontend --replicas={replicas} --context kind-choresync-cluster"
    requires_human_confirmation: true

forbidden_patterns:
  - "rm -rf"
  - "DROP TABLE"
  - "DROP DATABASE"
  - "TRUNCATE"
  - "DELETE FROM .* WHERE 1=1"
  - "gcloud projects delete"
  - "kubectl delete namespace"
  - "docker compose down -v"

default_fallback: "LEVEL_3_ESCALATE"
