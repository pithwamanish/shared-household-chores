name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # ============================================================================
  # Stage 1: Continuous Integration & Verification Gates
  # ============================================================================
  backend-ci:
    name: Backend CI (Go 1.22 + Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: choresync
          POSTGRES_PASSWORD: choresync_secret
          POSTGRES_DB: choresync
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 3s
          --health-timeout 3s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum

      - name: Download Go Modules
        run: go mod download

      - name: Go Vet
        run: go vet ./...

      - name: Run Backend Tests (Unit, Store & Postgres Integration)
        env:
          DATABASE_URL: postgres://choresync:choresync_secret@localhost:5432/choresync?sslmode=disable
          JWT_SECRET: ci_jwt_secret_token_choresync_test
          EMAIL_PROVIDER: mock
        run: go test -v -race ./...

  frontend-ci:
    name: Frontend CI (React + TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: TypeScript Typecheck & Lint
        run: npm run lint

      - name: Production Bundle Build (Vite)
        run: npm run build

  contract-audit:
    name: OpenAPI Contract Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Contract Exists & Valid YAML
        run: |
          test -f contracts/openapi.yaml
          python3 -m pip install pyyaml --quiet
          python3 -c "import yaml; yaml.safe_load(open('contracts/openapi.yaml'))"
          echo "OpenAPI contract syntax verified successfully."

  e2e-ci:
    name: End-to-End Tests (Playwright in Docker)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Observability Network
        run: docker network create observability-net || true

      - name: Start Full Stack in Docker Compose
        run: docker compose up -d --build postgres backend frontend

      - name: Wait for Backend & Frontend Health
        run: |
          echo "Waiting for services to become ready..."
          timeout 60 bash -c 'until curl -fsS http://localhost:8000/healthz > /dev/null && curl -fsS http://localhost:3000 > /dev/null; do sleep 2; done'
          echo "Services are online and healthy."

      - name: Run Playwright E2E Journeys
        run: docker compose run --rm e2e

      - name: Upload Test Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Stop Docker Compose Stack
        if: always()
        run: docker compose down -v

  # ============================================================================
  # Stage 2: Build & Push to Container Registry (Image Tag: YYYYMMDD-HHMMSS-shortsha)
  # ============================================================================
  build-and-push:
    name: "Build: Package & Push Images to Registry"
    needs: [backend-ci, frontend-ci, contract-audit, e2e-ci]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
      backend_image: ${{ steps.tag.outputs.backend_image }}
      frontend_image: ${{ steps.tag.outputs.frontend_image }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate YYYYMMDD-HHMMSS-shortsha Tag
        id: tag
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          if [ -z "$SHORT_SHA" ]; then
            SHORT_SHA=$(git rev-parse --short=7 HEAD 2>/dev/null || echo "dev")
          fi
          TIMESTAMP=$(date -u +'%Y%m%d-%H%M%S')
          IMAGE_TAG="${TIMESTAMP}-${SHORT_SHA}"
          
          # Lowercase repository owner for GHCR compatibility
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          BACKEND_IMG="ghcr.io/${REPO_LOWER}/backend"
          FRONTEND_IMG="ghcr.io/${REPO_LOWER}/frontend"
          
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_ENV
          echo "TIMESTAMP=${TIMESTAMP}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
          echo "BACKEND_IMG=${BACKEND_IMG}" >> $GITHUB_ENV
          echo "FRONTEND_IMG=${FRONTEND_IMG}" >> $GITHUB_ENV
          
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "backend_image=${BACKEND_IMG}" >> $GITHUB_OUTPUT
          echo "frontend_image=${FRONTEND_IMG}" >> $GITHUB_OUTPUT
          
          echo "Tagged build: ${IMAGE_TAG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend Image
        run: |
          echo "Building Backend Image with tag ${IMAGE_TAG}..."
          docker build \
            --label "org.opencontainers.image.version=${IMAGE_TAG}" \
            --label "org.opencontainers.image.revision=${SHORT_SHA}" \
            --label "org.opencontainers.image.created=${TIMESTAMP}" \
            -t "${BACKEND_IMG}:${IMAGE_TAG}" \
            -t "${BACKEND_IMG}:dev-latest" \
            ./backend
          docker push "${BACKEND_IMG}:${IMAGE_TAG}"
          docker push "${BACKEND_IMG}:dev-latest"

      - name: Build & Push Frontend Image
        run: |
          echo "Building Frontend Image with tag ${IMAGE_TAG}..."
          docker build \
            -f ./frontend/Dockerfile.prod \
            --label "org.opencontainers.image.version=${IMAGE_TAG}" \
            --label "org.opencontainers.image.revision=${SHORT_SHA}" \
            --label "org.opencontainers.image.created=${TIMESTAMP}" \
            -t "${FRONTEND_IMG}:${IMAGE_TAG}" \
            -t "${FRONTEND_IMG}:dev-latest" \
            ./frontend
          docker push "${FRONTEND_IMG}:${IMAGE_TAG}"
          docker push "${FRONTEND_IMG}:dev-latest"

      - name: Save Deployed Dev Image Tag Artifact
        run: |
          mkdir -p .build_metadata
          echo "${IMAGE_TAG}" > .build_metadata/latest_dev_tag.txt
          echo "Backend: ${BACKEND_IMG}:${IMAGE_TAG}" >> .build_metadata/images.txt
          echo "Frontend: ${FRONTEND_IMG}:${IMAGE_TAG}" >> .build_metadata/images.txt

      - name: Upload Build Metadata Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev-deployed-image-tag
          path: .build_metadata/
          retention-days: 30

  # ============================================================================
  # Stage 3: Deploy: Pull Pre-Built Images & Serve
  # ============================================================================
  deploy-dev:
    name: "Deploy: Pull from Registry & Serve (Dev)"
    needs: [build-and-push]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Pre-Built Dev Images from Registry
        env:
          BACKEND_IMG: ${{ needs.build-and-push.outputs.backend_image }}
          FRONTEND_IMG: ${{ needs.build-and-push.outputs.frontend_image }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          echo "Pulling backend image: ${BACKEND_IMG}:${IMAGE_TAG}"
          docker pull "${BACKEND_IMG}:${IMAGE_TAG}"
          
          echo "Pulling frontend image: ${FRONTEND_IMG}:${IMAGE_TAG}"
          docker pull "${FRONTEND_IMG}:${IMAGE_TAG}"

      - name: Serve via Docker Compose Deploy Stack
        env:
          BACKEND_IMAGE: "${{ needs.build-and-push.outputs.backend_image }}:${{ needs.build-and-push.outputs.image_tag }}"
          FRONTEND_IMAGE: "${{ needs.build-and-push.outputs.frontend_image }}:${{ needs.build-and-push.outputs.image_tag }}"
          PORT: 8088
        run: |
          echo "Starting pre-built containers with zero compilation..."
          docker compose -f docker-compose.deploy.yml up -d
          
          echo "Verifying running containers..."
          docker compose -f docker-compose.deploy.yml ps

      - name: Verify Live Endpoints Over HTTP
        run: |
          echo "Validating healthy response from pre-built registry images..."
          timeout 60 bash -c 'until curl -fsS http://localhost:8088/healthz > /dev/null; do sleep 2; done'
          echo "Dev deployment verified successfully on port 8088!"

      - name: Stop Compose Stack
        if: always()
        run: docker compose -f docker-compose.deploy.yml down

      - name: Trigger Cloud Provider Webhook (Optional Render Dev)
        run: |
          if [ -n "${{ secrets.RENDER_DEV_DEPLOY_HOOK_URL }}" ]; then
            echo "Dispatching webhook to Render Dev environment..."
            curl -f -X POST "${{ secrets.RENDER_DEV_DEPLOY_HOOK_URL }}"
            echo "Webhook triggered."
          elif [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "Dispatching webhook to Render default deploy..."
            curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
            echo "Webhook triggered."
          else
            echo "No webhook configured; registry images are live and ready."
          fi
