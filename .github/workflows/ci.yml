name: CI/CD Pipeline & Kind Delivery

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  APP_NAME: choresync
  KIND_CLUSTER_NAME: ${{ vars.KIND_CLUSTER_NAME || 'choresync-cluster' }}

jobs:
  # ============================================================================
  # Stage 1: Continuous Integration & Verification Gates
  # ============================================================================
  test:
    name: Unit, Integration & Contract Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum

      - name: Backend Tests (Go Unit & Store Tests)
        env:
          JWT_SECRET: ci_jwt_secret_token_choresync_test
          EMAIL_PROVIDER: mock
        run: |
          echo "==> Running Go backend unit & store tests..."
          cd backend
          go vet ./...
          if command -v pg_isready >/dev/null 2>&1 && pg_isready -h 127.0.0.1 -p 5433 -U choresync -d choresync >/dev/null 2>&1; then
            echo "PostgreSQL active on port 5433, running unit + postgres integration tests..."
            DATABASE_URL="postgres://choresync:choresync_secret@127.0.0.1:5433/choresync?sslmode=disable" go test -v ./...
          else
            echo "Running unit and store tests..."
            go test -v ./...
          fi

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Frontend CI (Lint & Production Bundle Build)
        run: |
          echo "==> Running Frontend lint & build..."
          cd frontend
          npm ci || npm install
          npm run lint
          npm run build

      - name: OpenAPI Contract Audit
        run: |
          echo "==> Auditing OpenAPI contract..."
          test -f contracts/openapi.yaml
          python3 -m pip install pyyaml --break-system-packages --quiet 2>/dev/null || python3 -m pip install pyyaml --quiet 2>/dev/null || true
          python3 -c "import yaml; yaml.safe_load(open('contracts/openapi.yaml'))"
          echo "OpenAPI contract syntax verified successfully."

  # ============================================================================
  # Stage 2: Build Application Images with Unique Immutable Tag (Only on Test Success)
  # ============================================================================
  build:
    name: Build Docker Images with Unique Tag
    needs: [test]
    if: success()
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.generate-tag.outputs.image_tag }}
      backend_image: ${{ steps.generate-tag.outputs.backend_image }}
      frontend_image: ${{ steps.generate-tag.outputs.frontend_image }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Unique Immutable Version Tag
        id: generate-tag
        run: |
          TIMESTAMP=$(date -u +'%Y%m%d-%H%M%S')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          if [ -z "${SHORT_SHA}" ] || [ "${SHORT_SHA}" = "0000000" ]; then
            SHORT_SHA=$(git rev-parse --short=7 HEAD 2>/dev/null || echo "dev")
          fi
          IMAGE_TAG="${TIMESTAMP}-${SHORT_SHA}"

          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_ENV
          echo "TIMESTAMP=${TIMESTAMP}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV

          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "backend_image=choresync-backend" >> $GITHUB_OUTPUT
          echo "frontend_image=choresync-frontend" >> $GITHUB_OUTPUT

          echo "==> Generated Unique Immutable Tag: ${IMAGE_TAG}"

      - name: Build Backend Docker Image
        run: |
          echo "==> Building choresync-backend:${IMAGE_TAG}..."
          docker build \
            --label "org.opencontainers.image.version=${IMAGE_TAG}" \
            --label "org.opencontainers.image.revision=${SHORT_SHA}" \
            --label "org.opencontainers.image.created=${TIMESTAMP}" \
            -t "choresync-backend:${IMAGE_TAG}" \
            -t "choresync-backend:dev-latest" \
            ./backend

      - name: Build Frontend Docker Image
        run: |
          echo "==> Building choresync-frontend:${IMAGE_TAG}..."
          docker build \
            -f ./frontend/Dockerfile.prod \
            --label "org.opencontainers.image.version=${IMAGE_TAG}" \
            --label "org.opencontainers.image.revision=${SHORT_SHA}" \
            --label "org.opencontainers.image.created=${TIMESTAMP}" \
            -t "choresync-frontend:${IMAGE_TAG}" \
            -t "choresync-frontend:dev-latest" \
            ./frontend

  # ============================================================================
  # Stage 3: Local Kind Delivery & Rollout Verification Gate
  # ============================================================================
  deploy-kind:
    name: Deploy to Kind Cluster & Verify Rollout
    needs: [test, build]
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure Kubeconfig Environment
        run: |
          mkdir -p "${HOME}/.kube"
          if [ "$(id -u)" -eq 0 ] && [ -f /root/.kube/config ] && [ -r /root/.kube/config ]; then
            echo "Using /root/.kube/config (act root runner detected)"
            echo "KUBECONFIG=/root/.kube/config" >> $GITHUB_ENV
          else
            echo "Using ${HOME}/.kube/config"
            echo "KUBECONFIG=${HOME}/.kube/config" >> $GITHUB_ENV
          fi

      - name: Ensure Kind and Kubectl CLI Tools
        run: |
          echo "==> Checking required CLI tools..."
          mkdir -p "${HOME}/.local/bin"
          echo "${HOME}/.local/bin" >> $GITHUB_PATH
          export PATH="${HOME}/.local/bin:${PATH}"

          if ! command -v kubectl >/dev/null 2>&1; then
            echo "Installing kubectl..."
            curl -fsSL -Lo "${HOME}/.local/bin/kubectl" "https://dl.k8s.io/release/v1.30.0/bin/linux/amd64/kubectl"
            chmod +x "${HOME}/.local/bin/kubectl"
          fi

          if ! command -v kind >/dev/null 2>&1; then
            echo "Installing kind..."
            curl -fsSL -Lo "${HOME}/.local/bin/kind" https://kind.sigs.k8s.io/dl/v0.23.0/kind-linux-amd64
            chmod +x "${HOME}/.local/bin/kind"
          fi
          kubectl version --client=true || true
          kind version || true

      - name: Ensure Kind Cluster Exists
        run: |
          echo "==> Ensuring Kind cluster '${KIND_CLUSTER_NAME}' is active..."
          if ! kind get clusters 2>/dev/null | grep -qx "${KIND_CLUSTER_NAME}"; then
            echo "Kind cluster '${KIND_CLUSTER_NAME}' not found. Creating it..."
            if [ -f "k8s/kind-cluster-config.yaml" ]; then
              kind create cluster --name "${KIND_CLUSTER_NAME}" --config k8s/kind-cluster-config.yaml --wait 120s
            else
              kind create cluster --name "${KIND_CLUSTER_NAME}" --wait 120s
            fi
          else
            echo "Kind cluster '${KIND_CLUSTER_NAME}' is already active."
          fi

      - name: Verify Kind Cluster Connectivity
        run: |
          echo "==> Checking Kind cluster '${KIND_CLUSTER_NAME}' status..."
          KIND_CTX="kind-${KIND_CLUSTER_NAME}"
          kubectl cluster-info --context "${KIND_CTX}" || kubectl cluster-info
          kubectl get nodes --context "${KIND_CTX}" || kubectl get nodes

      - name: Ensure Docker Images Built for Kind
        run: |
          IMAGE_TAG="${{ needs.build.outputs.image_tag }}"
          if [ -z "${IMAGE_TAG}" ]; then
            IMAGE_TAG=$(docker images --format '{{.Tag}}' choresync-frontend | grep -E '^[0-9]{8}-[0-9]{6}' | head -n 1)
            [ -z "${IMAGE_TAG}" ] && IMAGE_TAG="dev-latest"
          fi
          echo "==> Verifying Docker images for tag: ${IMAGE_TAG}"
          if ! docker image inspect "choresync-backend:${IMAGE_TAG}" >/dev/null 2>&1; then
            echo "==> Building backend image on runner VM..."
            docker build -t "choresync-backend:${IMAGE_TAG}" -t "choresync-backend:dev-latest" ./backend
          fi
          if ! docker image inspect "choresync-frontend:${IMAGE_TAG}" >/dev/null 2>&1; then
            echo "==> Building frontend image on runner VM..."
            docker build -f ./frontend/Dockerfile.prod -t "choresync-frontend:${IMAGE_TAG}" -t "choresync-frontend:dev-latest" ./frontend
          fi

      - name: Load Unique Docker Images into Kind Cluster
        run: |
          IMAGE_TAG="${{ needs.build.outputs.image_tag }}"
          if [ -z "${IMAGE_TAG}" ]; then
            IMAGE_TAG=$(docker images --format '{{.Tag}}' choresync-frontend | grep -E '^[0-9]{8}-[0-9]{6}' | head -n 1)
            [ -z "${IMAGE_TAG}" ] && IMAGE_TAG="dev-latest"
          fi
          echo "==> Loading Docker images with tag '${IMAGE_TAG}' into Kind cluster '${KIND_CLUSTER_NAME}'..."
          kind load docker-image "choresync-backend:${IMAGE_TAG}" --name "${KIND_CLUSTER_NAME}"
          kind load docker-image "choresync-frontend:${IMAGE_TAG}" --name "${KIND_CLUSTER_NAME}"
          echo "==> Images loaded successfully into Kind cluster nodes."

      - name: Deploy Manifests to Kind Cluster
        run: |
          IMAGE_TAG="${{ needs.build.outputs.image_tag }}"
          if [ -z "${IMAGE_TAG}" ]; then
            IMAGE_TAG=$(docker images --format '{{.Tag}}' choresync-frontend | grep -E '^[0-9]{8}-[0-9]{6}' | head -n 1)
            [ -z "${IMAGE_TAG}" ] && IMAGE_TAG="dev-latest"
          fi
          KIND_CTX="kind-${KIND_CLUSTER_NAME}"
          echo "==> Applying declarative Kubernetes manifests in k8s/..."
          kubectl apply -k k8s/ --context "${KIND_CTX}"

          echo "==> Updating deployment images to immutable tag: ${IMAGE_TAG}"
          kubectl set image deployment/backend backend="choresync-backend:${IMAGE_TAG}" --context "${KIND_CTX}"
          kubectl set image deployment/frontend frontend="choresync-frontend:${IMAGE_TAG}" --context "${KIND_CTX}"

      - name: Wait for Pod Rollout to Complete
        run: |
          KIND_CTX="kind-${KIND_CLUSTER_NAME}"
          echo "==> Waiting for postgres rollout..."
          kubectl rollout status deployment/postgres --context "${KIND_CTX}" --timeout=120s || true

          echo "==> Waiting for rollout of deployment/backend to finish (timeout: 120s)..."
          kubectl rollout status deployment/backend --context "${KIND_CTX}" --timeout=120s

          echo "==> Waiting for rollout of deployment/frontend to finish (timeout: 120s)..."
          kubectl rollout status deployment/frontend --context "${KIND_CTX}" --timeout=120s

          echo "==> Waiting for all pods to reach Ready state..."
          kubectl wait --for=condition=ready pod -l app=backend --context "${KIND_CTX}" --timeout=60s
          kubectl wait --for=condition=ready pod -l app=frontend --context "${KIND_CTX}" --timeout=60s
          echo "==> Deployment rollout completed successfully with zero downtime!"

      - name: Verify Live Application Endpoint & Heading
        run: |
          echo "==> Verifying running pods in Kind..."
          KIND_CTX="kind-${KIND_CLUSTER_NAME}"
          kubectl get pods --context "${KIND_CTX}" -o wide

          echo "==> Checking HTTP readiness probe on NodePort / hostPort 8090..."
          curl -fsS http://127.0.0.1:8090/healthz

          echo "==> Verifying Frontend Visible Text Verification Gate..."
          curl -fsS http://127.0.0.1:8090/ | grep -i "Kind Rollout Verified"
          echo ""
          echo "==> SUCCESS: Frontend Visible Text Verification Gate PASSED on Kind port 8090!"
